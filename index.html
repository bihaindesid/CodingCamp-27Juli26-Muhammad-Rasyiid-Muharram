<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Theme Toggle -->
        <div class="theme-toggle">
            <button id="themeToggle" class="theme-btn" title="Toggle light/dark mode">
                <span class="theme-icon">🌙</span>
            </button>
        </div>

        <!-- Greeting Section -->
        <section class="greeting-section">
            <div class="time-display" id="timeDisplay">00:00:00</div>
            <div class="date-display" id="dateDisplay">Loading...</div>
            <h1 class="greeting" id="greeting">Good Morning</h1>
            <div class="name-container">
                <input type="text" id="nameInput" class="name-input" placeholder="Enter your name">
                <button id="saveName" class="save-btn">Save</button>
            </div>
            <h2 class="user-greeting" id="userGreeting"></h2>
        </section>

        <!-- Focus Timer Section -->
        <section class="timer-section">
            <h2>Focus Timer</h2>
            <div class="timer-settings">
                <label for="timerMinutes">Minutes:</label>
                <input type="number" id="timerMinutes" min="1" max="60" value="25">
                <button id="setTimer" class="set-btn">Set</button>
            </div>
            <div class="timer-display" id="timerDisplay">25:00</div>
            <div class="timer-controls">
                <button id="startTimer" class="btn btn-start">Start</button>
                <button id="stopTimer" class="btn btn-stop">Stop</button>
                <button id="resetTimer" class="btn btn-reset">Reset</button>
            </div>
        </section>

        <!-- To-Do List Section -->
        <section class="todo-section">
            <h2>To-Do List</h2>
            <div class="todo-controls">
                <input type="text" id="todoInput" class="todo-input" placeholder="Add a new task...">
                <button id="addTodo" class="btn btn-add">Add</button>
                <button id="sortTodos" class="btn btn-sort">Sort A-Z</button>
            </div>
            <ul class="todo-list" id="todoList"></ul>
        </section>

        <!-- Quick Links Section -->
        <section class="links-section">
            <h2>Quick Links</h2>
            <div class="link-controls">
                <input type="text" id="linkName" class="link-input" placeholder="Link name">
                <input type="url" id="linkUrl" class="link-input" placeholder="https://example.com">
                <button id="addLink" class="btn btn-add">Add Link</button>
            </div>
            <div class="links-container" id="linksContainer"></div>
        </section>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
